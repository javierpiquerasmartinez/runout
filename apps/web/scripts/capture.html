<!doctype html>
<!-- The scene alone, for `pnpm capture:landing`: no bar, no copy, one stop at a time. Vite serves it in development only. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runout: the scene, for its still captures</title>
    <style>
      html,
      body {
        margin: 0;
        background: #050606;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="module">
      // The face the cards' ranks are drawn in.
      import '@fontsource/ibm-plex-mono/600.css'
      import { stops } from '/src/landing/scene/choreography.ts'
      import { mountLandingScene } from '/src/landing/scene/LandingScene.ts'

      // A still draws what `high` draws, with its depth of field, the wave whole and nothing drifting.
      const scene = mountLandingScene(document.querySelector('canvas'), { tier: 'still', depthOfField: true })
      const frames = async (count) => {
        for (let frame = 0; frame < count; frame++) await new Promise((drawn) => requestAnimationFrame(drawn))
      }

      window.capture = {
        stops: stops.length,
        /** Rests the story on a stop and waits for it to be drawn. */
        async show(stop) {
          scene.setProgress(stops[stop].at)
          await frames(4)
        },
        /** A PNG, scaled to `width` by `height` and encoded as `type` (WebP, or JPEG for the link preview's picture); both ends in base64. */
        async encode(png, width, height, quality, type = 'image/webp') {
          const picture = await createImageBitmap(await (await fetch(`data:image/png;base64,${png}`)).blob())
          const canvas = new OffscreenCanvas(width, height)
          const context = canvas.getContext('2d')
          context.imageSmoothingQuality = 'high'
          context.drawImage(picture, 0, 0, width, height)
          const encoded = await canvas.convertToBlob({ type, quality })
          const bytes = new Uint8Array(await encoded.arrayBuffer())
          let binary = ''
          for (const byte of bytes) binary += String.fromCharCode(byte)
          return btoa(binary)
        },
      }
    </script>
  </body>
</html>
